          "notes_md": "# География Конспект в тетрадь\n**Дата:** 22 сентября 2026 г. (Вторник)\n**Преподаватель:** Бахтина С.А. **Кабинет:** 303 **Время:** 14:00 – 15:30\n\n---\n\n### ТЕМА УРОКА\n> <u>**Семинар: Географические особенности размещения природных ресурсов мира. Ресурсообеспеченность.**</u>\n\n---\n\n### 1. Итоги проверки самостоятельной работы студентов\n\nНа занятии проведён опрос по индивидуальным вопросам и ответам, подготовленным дома по темам ресурсообеспеченности и размещения мировых природных богатств.\n\n* <u>**Ключевой географический вывод:**</u> природные ресурсы распределены по планете крайне неравномерно в силу геологического строения земной коры, рельефа и климатической зональности.\n* <u>**Диспропорция потребления:**</u> основные запасы сырья сосредоточены в развивающихся странах и странах с обширной территорией (Россия, Бразилия, Канада, Китай), тогда как главными потребителями ресурсов выступают экономически высокоразвитые государства (США, страны Западной Европы, Япония).\n\n---\n\n### 2. Сравнительная характеристика ресурсных поясов мира\n\n| Вид ресурсов | Географические пояса и регионы концентрации | Страны-лидеры по запасам |\n| :--- | :--- | :--- |\n| **Топливные ресурсы (нефть, газ, уголь)** | Осадочные чехлы древних платформ и предгорные прогибы: бассейн Персидского залива, Западная Сибирь, шельф Северного моря, Мексиканский залив | Саудовская Аравия, Россия, США, Иран, Катар, Венесуэла |\n| **Рудные ресурсы (чёрные и цветные металлы)** | Складчатые пояса и щиты древних платформ: Балтийский, Канадский, Алданский щиты, Кордильеры и Анды | Россия, Австралия, Бразилия, Китай, Чили (медь), ЮАР |\n| **Лесные ресурсы** | **Северный лесной пояс:** хвойные бореальные леса умеренного пояса.<br>**Южный лесной пояс:** влажные тропические и экваториальные леса. | Россия, Бразилия, Канада, США, ДР Конго, Индонезия |\n| **Водные ресурсы (пресный сток)** | Экваториальный пояс (бассейны рек Амазонка, Конго) и умеренный пояс Северного полушария | Бразилия, Россия, Канада, США, Китай |\n\n---\n\n### 3. Домашнее задание (под диктовку учителя)\n* <u>Дать развёрнутую письменную характеристику государственного управления и личностей 3–4 выдающихся исторических правителей</u> (например: Александр Македонский, Гай Юлий Цезарь и др.):\n  * В каком возрасте пришёл к власти и каковы были стартовые условия государства;\n  * Направления и географические цели военных походов (захват новых территорий, людских и природных ресурсов);\n  * Методы удержания власти и причины распада созданных империй.",

          "notes_md": "# История Конспект в тетрадь\n**Дата:** 22 сентября 2026 г. (Вторник)\n**Преподаватель:** Попова А.А. **Кабинет:** 207 **Время:** 15:40 – 18:50\n\n---\n\n### ТЕМА УРОКА\n> <u>**Образование Древнерусского государства. Первые русские князья и их внутренняя и внешняя политика.**</u>\n\n---\n\n### 1. Предпосылки образования государства и расселение славян\n\n* <u>**Государство**</u> — властно-политическая организация общества, обладающая суверенитетом, аппаратом управления и принуждения, а также исключительным правом взимания налогов и издания законов.\n  * Возникает при переходе от родовой общины к соседской, росте производительности труда, появлении излишков и имущественного расслоения.\n* <u>**Ветви славянского этноса:**</u>\n  * <u>Западные:</u> поляки, чехи, словаки.\n  * <u>Южные:</u> болгары, сербы, хорваты, словенцы.\n  * <u>Восточные:</u> русские, украинцы, белорусы (в V–VIII вв. расселились по Восточно-Европейской равнине).\n* <u>**Границы расселения восточнославянских союзов племён:**</u>\n  * **Северная граница:** Ладожское и Онежское озёра, Финский залив.\n  * **Южная граница:** причерноморские степи, устья рек Днепр и Дунай.\n  * **Западная граница:** предгорья Карпатских гор.\n  * **Восточная граница:** междуречье и слияние рек Ока и Волга.\n\n---\n\n### 2. Торговый путь «из варяг в греки»\n\nГлавная экономическая артерия Древней Руси, связавшая Балтику и Скандинавию с Черным морем и Византийской империей:\n$$\\text{Балтийское море} \\rightarrow \\text{Финский залив} \\rightarrow \\text{р. Нева} \\rightarrow \\text{Ладожское озеро} \\rightarrow \\text{р. Волхов} \\rightarrow \\text{оз. Ильмень} \\rightarrow \\text{р. Ловать} \\rightarrow \\text{волоки} \\rightarrow \\text{р. Днепр} \\rightarrow \\text{Чёрное море} \\rightarrow \\text{Константинополь (Царьград)}$$\n\n---\n\n### 3. Таблица правления первых русских князей (IX — X вв.)\n\n| Князь / Правитель | Годы правления | Ключевые события внутренней политики | Основные направления внешней политики |\n| :--- | :---: | :--- | :--- |\n| <u>**Рюрик**</u> | 862–879 | Призвание варягов на княжение новгородскими ильменскими словенами и кривичами. Основание княжеской династии Рюриковичей. Столицы: Ладога, Новгород. | Укрепление северных рубежей, охрана торговых факторий. |\n| <u>**Олег Вещий**</u> | 879–912 | **882 г. — объединение Новгорода и Киева.** Убийство Аскольда и Дира, провозглашение Киева «матерью городов русских». Подчинение полян, древлян, северян, радимичей. | **Походы на Византию (907 и 911 гг.):** победа под стенами Царьграда, щит на вратах Царьграда. Заключение **первых выгодных письменных торговых договоров** (беспошлинная торговля для русских купцов). |\n| <u>**Игорь Старый**</u> | 912–945 | Сбор дани методом **полюдья** (круговой объезд подвластных земель с ноября по апрель). В **945 г.** жестоко убит древлянами в г. Искоростень при попытке повторного грабительского сбора дани. | Походы на Константинополь: в **941 г.** русский флот сожжён «греческим огнём»; в **944 г.** заключён взаимовыгодный военно-торговый договор. Отражение первых набегов печенегов (915 г.). |\n| <u>**Княгиня Ольга**</u> *(Святая)* | 945–964 | Подавление восстания древлян (сожжение Искоростеня). **Первая государственная налоговая реформа:** замена стихийного полюдья на строгий **повоз**; установлены **уроки** (фиксированный размер дани) и учреждены **погосты** (специальные пункты сбора дани). | **957 г. — визит в Константинополь**, принятие христианства под именем Елена (крестным отцом стал император Константин Багрянородный). Дипломатическое укрепление авторитета Руси. |\n| <u>**Святослав Игоревич**</u> *(Храбрый)* | 964–972 | Великий полководец («Иду на вы!»). Внутренними делами управляла мать Ольга, сам Святослав всю жизнь провел в военных походах. | **965–969 гг. — полный разгром Хазарского каганата** (взятие крепостей Саркел/Белая Вежа на Дону, Итиль на Волге, Семендер). Войны в Дунайской Болгарии (столица в Переяславце-на-Дунае). Война с Византией, героическая оборона Доростола (971 г.). В **972 г.** погиб в засаде печенегов у днепровских порогов (хан Куря сделал чашу из его черепа). |\n\n---\n\n### 4. Домашнее задание\n* Заполнить хронологическую таблицу походов первых русских князей в тетради.\n* Знать термины: *полюдье, повоз, уроки, погосты, путь «из варяг в греки»*.",

внешней политики |\n| :--- | :---: | :--- | :--- |\n| <u>**Рюрик**</u> | 862–879 | Призвание варягов на княжение новгородскими ильменскими словенами и кривичами. Основание княжеской династии Рюриковичей. Столицы: Ладога, Новгород. | Укрепление северных рубежей, охрана торговых факторий. |\n| <u>**Олег Вещий**</u> | 879–912 | **882 г. — объединение Новгорода и Киева.** Убийство Аскольда и Дира, провозглашение Киева «матерью городов русских». Подчинение полян, древлян, северян, радимичей. | **Походы на Византию (907 и 911 гг.):** победа под стенами Царьграда, щит на вратах Царьграда. Заключение **первых выгодных письменных торговых договоров** (беспошлинная торговля для русских купцов). |\n| <u>**Игорь Старый**</u> | 912–945 | Сбор дани методом **полюдья** (круговой объезд подвластных земель с ноября по апрель). В **945 г.** жестоко убит древлянами в г. Искоростень при попытке повторного грабительского сбора дани. | Походы на Константинополь: в **941 г.** русский флот сожжён «греческим огнём»; в **944 г.** заключён взаимовыгодный военно-торговый договор. Отражение первых набегов печенегов (915 г.). |\n| <u>**Княгиня Ольга**</u> *(Святая)* | 945–964 | Подавление восстания древлян (сожжение Искоростеня). **Первая государственная налоговая реформа:** замена стихийного полюдья на строгий **повоз**; установлены **уроки** (фиксированный размер дани) и учреждены **погосты** (специальные пункты сбора дани). | **957 г. — визит в Константинополь**, принятие христианства под именем Елена (крестным отцом стал император Константин Багрянородный). Дипломатическое укрепление авторитета Руси. |\n| <u>**Святослав Игоревич**</u> *(Храбрый)* | 964–972 | Великий полководец («Иду на вы!»). Внутренними делами управляла мать Ольга, сам Святослав всю жизнь провел в военных походах. | **965–969 гг. — полный разгром Хазарского каганата** (взятие крепостей Саркел/Белая Вежа на Дону, Итиль на Волге, Семендер). Войны в Дунайской Болгарии (столица в Переяславце-на-Дунае). Война с Византией, героическая оборона Доростола (971 г.). В **972 г.** погиб в засаде печенегов у днепровских порогов (хан Куря сделал чашу из его черепа). |\n\n---\n\n### 4. Домашнее задание\n* Заполнить хронологическую таблицу походов первых русских князей в тетради.\n* Знать термины: *полюдье, повоз, уроки, погосты, путь «из варяг в греки»*.",

          "notes_md": "# География Конспект в тетрадь\n**Дата:** 23 сентября 2026 г. (Среда)\n**Преподаватель:** Бахтина С.А. **Кабинет:** 305 **Время:** 08:30 – 10:00\n\n---\n\n### ТЕМА УРОКА\n> <u>**Введение в социально-экономическую географию мира. Территориальная организация общества и показатели благосостояния.**</u>\n\n---\n\n### 1. Предмет и задачи социально-экономической географии\n\n* <u>**Социально-экономическая география**</u> — это фундаментальная общественно-географическая наука, изучающая закономерности территориальной организации человеческого общества, размещения производительных сил и взаимодействия населения с окружающей средой.\n\n---\n\n### 2. Три главных типа объектов социально-экономической географии\n\n| Тип объектов | Состав и структура | Роль в развитии территории |\n| :--- | :--- | :--- |\n| **1. Природные объекты** | Природные комплексы, месторождения полезных ископаемых, водные артерии, лесные массивы, климатические зоны | Служат первичной сырьевой и энергетической базой для экономической деятельности |\n| **2. Социальные объекты** | Население, трудовые ресурсы, демографическая структура, системы расселения (города, села) | Выступают одновременно главной производительной силой и потребителем материальных благ |\n| **3. Производственно-инфраструктурные объекты** | Промышленные заводы, аграрные комплексы, транспортные коммуникации (автодороги, Ж/Д, авиация), социальные институты (школы, больницы, сфера услуг) | Создают добавленную стоимость, обеспечивают связность территории и жизнедеятельность граждан |\n\n---\n\n### 3. Экономические показатели: ВВП и ВРП\n\n* <u>**Валовой внутренний продукт (ВВП) / Валовой региональный продукт (ВРП):**</u>\n  * Совокупная рыночная стоимость всех конечных товаров и услуг, произведённых на территории государства (или субъекта/республики) за один календарный год.\n* <u>**ВВП на душу населения:**</u>\n  $$ВВП_{\\text{на душу}} = \\frac{\\text{Общий объём ВВП}}{\\text{Численность населения}}$$\n  * Теоретически отражает долю общественного богатства, приходящуюся на каждого жителя.\n  * На практике эти финансовые потоки распределяются через бюджет на развитие капитальной инфраструктуры (строительство дорог, мостов, модернизацию коммунальных сетей, обновление общественного транспорта, возведение образовательных и медицинских учреждений).\n\n---\n\n### 4. Домашнее задание (под диктовку учителя)\n* <u>Письменно ответить на вопрос:</u> из каких отраслей и видов продукции (промышленность, сельское хозяйство, добыча сырья, сектор услуг) формируется валовой продукт региона (на примере Республики Татарстан / РФ)?",

          "notes_md": "# Биология Конспект в тетрадь\n**Дата:** 24 сентября 2026 г. (Четверг)\n**Преподаватель:** Валеева А.Р. **Кабинет:** 305 **Время:** 14:00 – 15:30\n\n---\n\n### ТЕМА УРОКА\n> <u>**Биосинтез белка: транскрипция и трансляция. Решение генетических задач по молекулярной биологии.**</u>\n\n---\n\n### 1. Этапы биосинтеза белка\n\nБиосинтез белка — ключевой процесс пластического обмена (анаболизма), в ходе которого генетическая информация, закодированная в молекуле ДНК, реализуется в виде полипептидной цепи (белка).\n\n1. <u>**Транскрипция (происходит в ядре клетки):**</u>\n   * Процесс переписывания генетической информации с матрицы ДНК на информационную (матричную) РНК — **иРНК**.\n   * Синтез осуществляется специальным ферментом (РНК-полимеразой) по **принципу комплементарности**.\n   * иРНК является единой непрерывной матрицей, передающей код из ядра в цитоплазму.\n\n2. <u>**Трансляция (происходит на рибосомах в цитоплазме):**</u>\n   * Рибосома связывается с молекулой иРНК и продвигается по ней триплет за триплетом.\n   * Молекулы транспортной РНК (**тРНК**) доставляют соответствующие аминокислоты к рибосоме.\n   * На одном конце тРНК находится триплет нуклеотидов — **антикодон**, комплементарный кодону иРНК, а на противоположном — специфическая аминокислота.\n   * Между соседними аминокислотами формируется прочная ковалентная **пептидная связь** ($-\\text{CO}-\\text{NH}-$), образуя растущую полипептидную цепь.\n\n3. <u>**Посттрансляционная модификация (созревание белка):**</u>\n   * Синтезированная линейная полипептидная цепочка сходит с рибосомы и сворачивается (фолдинг) во вторичную, третичную (глобулярную) или четвертичную конформацию.\n\n---\n\n### 2. Принцип комплементарности и свойства генетического кода\n\n* <u>**Правило водородных связей:**</u>\n  * В молекуле ДНК: Аденин соединяется с Тимином двумя водородными связями ($\\text{А} = \\text{Т}$), Гуанин с Цитозином — тремя ($\\text{Г} \\equiv \\text{Ц}$).\n  * В РНК тимин отсутствует, его функциональным аналогом является **Урацил (У)**:\n    $$\\text{ДНК} \\longrightarrow \\text{иРНК}$$\n    $$\\text{Т} \\longrightarrow \\text{А}$$\n    $$\\text{А} \\longrightarrow \\text{У}$$\n    $$\\text{Ц} \\longrightarrow \\text{Г}$$\n    $$\\text{Г} \\longrightarrow \\text{Ц}$$\n\n* <u>**Свойства генетического кода:**</u>\n  * **Триплетность:** каждую аминокислоту кодирует тройка нуклеотидов (триплет / кодон).\n  * **Однозначность (специфичность):** один кодон шифрует строго одну конкретную аминокислоту.\n  * **Вырожденность (избыточность):** одна аминокислота может кодироваться несколькими разными триплетами.\n  * **Универсальность:** генетический код одинаков для всех живых организмов на Земле.\n  * **Неперекрываемость:** нуклеотиды считываются строго последовательно, один нуклеотид не может входить в состав двух соседних кодонов.\n\n* <u>**Старт- и стоп-кодоны:**</u>\n  * **Старт-кодон:** $\\text{АУГ}$ (соответствует аминокислоте **Мет** — метионин; запускает начало трансляции).\n  * **Стоп-кодоны (нонсенс-триплеты):** $\\text{УАА}$, $\\text{УАГ}$, $\\text{УГА}$ (не кодируют аминокислот; служат сигналом завершения синтеза полипептида, обозначаются знаком «тире» или прочерком).\n\n---\n\n### 3. Алгоритм и правила оформления задач на биосинтез белка\n\n* **Правило записи молекул:**\n  * Цепь ДНК и цепь иРНК записываются сплошным рядом букв (без запятых), так как представляют собой **единые полимерные молекулы**.\n  * Антикодоны тРНК записываются **строго через запятую** (например: $\\text{УАЦ, ЦГА, АУУ}$), так как это **отдельные независимые молекулы** транспортных РНК!\n  * Аминокислотная последовательность белка записывается через дефис (пептидные связи), например: $\\text{Мет}-\\text{Ала}-\\text{Асн}$.\n  * Аминокислоты определяются по **таблице генетического кода** строго по кодонам **иРНК** (не тРНК!).\n\n* **Пример решения типовой задачи:**\n  1. Дана матричная цепь ДНК:\n     $$\\text{ДНК: ТАЦ-ЦГА-ТТА-АЦТ}$$\n  2. По принципу комплементарности строим иРНК:\n     $$\\text{иРНК: АУГ-ГЦУ-ААУ-УГА}$$\n  3. Находим антикодоны молекул тРНК (через запятую):\n     $$\\text{тРНК: УАЦ, ЦГА, УУА, АЦУ}$$\n  4. По таблице генетического кода для триплетов иРНК определяем полипептид:\n     * $\\text{АУГ} \\longrightarrow \\text{Мет}$ (старт)\n     * $\\text{ГЦУ} \\longrightarrow \\text{Ала}$\n     * $\\text{ААУ} \\longrightarrow \\text{Асн}$\n     * $\\text{УГА} \\longrightarrow \\text{Стоп-кодон}$ (окончание синтеза)\n     $$\\text{Белок: Мет}-\\text{Ала}-\\text{Асн}$$\n\n---\n\n### 4. Подготовка к контрольной работе (важное замечание преподавателя)\n* На следующем занятии проводится **контрольная работа №1** по разделу «Обмен веществ (метаболизм) и биосинтез белка».\n* Структура контрольной работы:\n  1. Тестовая часть (базовый уровень на оценку «3»).\n  2. Индивидуальная генетическая задача на биосинтез белка с полным пояснением этапов транскрипции и трансляции (на оценку «4» или «5»).\n* Иметь при себе распечатанную таблицу генетического кода!",
          "topic": "Биосинтез белка: транскрипция и трансляция. Решение генетических задач по молекулярной биологии."

          "notes_md": "# Литература Конспект в тетрадь\n**Дата:** 24 сентября 2026 г. (Четверг)\n**Преподаватель:** Галавова Г.В. **Кабинет:** 203 **Время:** 15:40 – 17:10\n\n---\n\n### ТЕМА УРОКА\n> <u>**Драматургия А.Н. Островского («Гроза»). Система образов и символика пьесы. Введение в роман И.А. Гончарова «Обломов».**</u>\n\n---\n\n### 1. Система персонажей пьесы А.Н. Островского «Гроза»\n\n* <u>**Кудряш (Ваня Кудряш):**</u>\n  * Молодой приказчик Дикого.\n  * Смелый, дерзкий, не боится самодуров, однако его бунт сугубо индивидуалистический («бунт ради себя»), лишённый высшей моральной цели.\n* <u>**Тихон Кабанов:**</u>\n  * Муж Катерины, сын Марфы Игнатьевны Кабановой (Кабанихи).\n  * Добрый, искренне любящий жену, но абсолютно безвольный, забитый и слабохарактерный человек. Находится в полной рабской зависимости от деспотичной матери.\n  * Не способен защитить ни себя, ни свою любовь, что толкает Катерину к гибели.\n* <u>**Варвара:**</u>\n  * Сестра Тихона.\n  * Живёт по циничному принципу приспособленчества: *«Делай что хочешь, только бы шито да крыто было»*.\n  * Символизирует компромисс и ложь как форму выживания в «тёмном царстве».\n\n---\n\n### 2. Символика грозы в драме\n\n* <u>**Многозначность образа грозы:**</u>\n  * Гроза в драме Островского — это не просто атмосферное природное явление, а центральный сквозной символ всего произведения.\n  * **Символ Божьего гнева и кары:** для жителей города Калинова (и самой верующей Катерины) гроза — это грозное предупреждение свыше, возмездие за содеянный грех.\n  * **Символ душевного смятения и страсти:** нарастание грозы в природе совпадает с душевной бурей Катерины, разрывающейся между чувством долга и искренней любовью.\n  * **Символ очищения и освобождения:** гроза разряжает духоту города Калинова. Для Катерины трагический финал становится выходом из нравственного тупика и освобождением от гнёта ханжеской морали.\n* <u>**Финал пьесы:**</u>\n  * Бунт Тихона над телом погибшей жены: *«Хорошо тебе, Катя! А я-то зачем остался жить на свете да мучиться!»*\n  * Эти слова Тихона звучат как страшный приговор самодурству Кабанихи и всему закостенелому укладу патриархального мира.\n\n---\n\n### 3. Роман И.А. Гончарова «Обломов». Понятие «обломовщины»\n\n* <u>**Илья Ильич Обломов:**</u> помещик, представитель дворянского сословия, обладающий чистой и поэтичной душой, но парализованный ленью, апатией и неспособностью к практической деятельности.\n* <u>**Обломовщина:**</u>\n  * Социально-психологическое явление русской жизни, порождённое крепостничеством и праздным барским существованием.\n  * Характеризуется пассивностью, уходом от реальности в мир грёз и мечтаний, страхом перед любым волевым усилием и душевным застоем.\n\n---\n\n### 4. Домашнее задание (строго под запись)\n1. <u>Прочитать:</u> роман И.А. Гончарова «Обломов».\n2. <u>Письменно в тетради (мини-сочинение):</u> написать развёрнутый ответ (5–7 предложений) на тему:\n   > **«Что такое обломовщина и есть ли она во мне?»**\n3. <u>Внимание:</u> прочтение произведения и сдача сочинения являются обязательным условием для получения допуска и автомата по литературе!",

          "notes_md": "# География Конспект в тетрадь\n**Дата:** 25 сентября 2026 г. (Пятница)\n**Преподаватель:** Бахтина С.А. **Кабинет:** 302 **Время:** 10:10 – 13:40 (2 пары)\n\n---\n\n### ТЕМА УРОКА\n> <u>**Формирование политической карты мира. Роль исторических лидеров в трансформации границ и периодизация развития политической карты.**</u>\n\n---\n\n### 1. Исторические личности и трансформация политической карты\n\nПолитическая карта мира складывалась веками в результате военных завоеваний, межгосударственных союзов, распада империй и экономических преобразований. Деятельность выдающихся правителей закладывала экономическую и территориальную основу современных государств.\n\n* <u>**Александр Македонский (IV в. до н. э.):**</u>\n  * Создание грандиозной державы, простиравшейся от Балканского полуострова и Египта до Средней Азии (территории современных Таджикистана и Узбекистана) и границ Индии.\n  * *Причины быстрого распада империи:* после смерти Александра империя распалась из-за внутренних распрей между военачальниками (диадохами), культурной и религиозной неоднородности покорённых народов и отсутствия устойчивых внутренних экономических связей.\n* <u>**Гай Юлий Цезарь и Клеопатра (I в. до н. э.):**</u>\n  * Геополитическая борьба за контроль над Средиземным морем между Римской республикой и эллинистическим Египтом.\n  * Взаимодействие двух держав носило не только военный, но и торгово-экономический характер: обеспечение продовольственной безопасности Рима (египетское зерно) и контроль морских торговых путей.\n* <u>**Карл Великий (VIII–IX вв.):**</u>\n  * Создатель Франкской империи, объединившей большую часть Западной и Центральной Европы; прообраз европейской интеграции.\n  * Проведение денежной реформы (введение единой серебряной монеты), унификация законов, опора на католическую церковь для централизации управления.\n* <u>**Чингисхан и Монгольская империя (XIII в.):**</u>\n  * Создание крупнейшей в мировой истории континентальной империи.\n  * Полный контроль над трансевразийскими торговыми путями (Великий шёлковый путь).\n  * На Руси — установление монголо-татарского ига (Золотая Орда), система баскачества, выплата дани и институт заложников для удержания политического повиновения князей.\n* <u>**Пётр I (XVII–XVIII вв.):**</u>\n  * Коренное изменение геополитического статуса России: завоевание выхода к Балтийскому морю («прорубил окно в Европу»), превращение Московского царства в Российскую империю (1721 г.).\n  * Создание мощного регулярного флота, развитие металлургии, горного дела и мануфактурной торговли.\n\n---\n\n### 2. Зарождение экономической географии и роль карт\n\n* <u>**Политическая карта мира**</u> — это тематическая географическая карта, отображающая территориально-политическое деление мира: суверенные государства, зависимые территории, их границы, столицы и форму правления.\n* <u>**Коммерческая (экономическая) география:**</u>\n  * Зародилась в среде итальянских (Венеция, Генуя) и голландских купцов и мореплавателей.\n  * Для организации торговых караванов и морских экспедиций требовались карты с фиксацией не только береговых линий, но и морских течений, безопасных фарватеров, характеристик гаваней, источников дефицитного сырья и рынков сбыта товаров.\n* <u>**Эпоха Великих географических открытий (XV–XVI вв.):**</u>\n  * Картография стала стратегической государственной тайной. Обладание точной картой морского маршрута давало абсолютное преимущество в торговле и колонизации.\n\n---\n\n### 3. Взаимосвязь экономики и политики\n\n* Карта называется **политической**, но её первопричина — **экономика**.\n* *«Без экономики нет политики, а политика всегда опирается на экономику»* — передел границ, аннексии, колонизация и объединение территорий всегда диктуются борьбой за природные ресурсы, морские проливы, торговые пути и плодородные земли.\n\n---\n\n### 4. Этапы формирования политической карты мира (запись в 3 колонки)\n\n| Период и формация | Сущность этапа и ключевые события | Примеры государств эпохи |\n| :--- | :--- | :--- |\n| **1. Древний период**<br>*(до V века н. э.)*<br><br><u>Общественный строй:</u><br>рабовладельческий | • Возникновение, расцвет и гибель первых рабовладельческих цивилизаций.<br>• Начало территориального раздела мира, первые крупные военные походы.<br>• Установление межгосударственных контактов, установление постоянных границ.<br>• Формирование государственных структур, чеканка собственной монеты, военные укрепления. | • Древний Египет<br>• Вавилон<br>• Древняя Греция<br>• Древний Рим<br>• Древний Китай<br>• Персия |\n| **2. Средневековый период**<br>*(V — XV/XVI века)*<br><br><u>Общественный строй:</u><br>феодализм | • Переход от рабовладения к феодальной зависимости (феодалы-землевладельцы и зависимое крестьянство).<br>• Захваты больших массивов суши, периоды феодальной раздробленности и последующей централизации.<br>• Монголо-татарское нашествие (Золотая Орда), установление даннических отношений.<br>• Развитие торговых связей, мореплавания и подготовка к Великим географическим открытиям. | • Священная Римская империя<br>• Византия<br>• Киевская Русь / Московское государство<br>• Арабский халифат<br>• Золотая Орда<br>• Португалия, Испания, Англия, Франция |\n| **3. Новый период**<br>*(XVI в. — 1914 г.)*<br><br><u>Общественный строй:</u><br>зарождение и развитие капитализма | • Великие географические открытия и колониальный раздел Америки, Азии, Африки.<br>• Формирование крупнейших колониальных империй (Великобритания, Испания, Португалия, Франция, Нидерланды).<br>• Окончательный территориальный раздел мира к началу XX века и борьба за его передел. | • Британская империя<br>• Российская империя<br>• Франция, Испания, Португалия<br>• Германская империя, Австро-Венгрия, США |\n| **4. Новейший период**<br>*(с 1914 г. по настоящее время)*<br><br><u>Ключевые вехи:</u><br>XX — XXI вв. | • **I этап (1914–1939):** распад Российской, Австро-Венгерской, Османской империй; образование СССР, появление новых государств в Европе.<br>• **II этап (1945–1950-е):** послевоенный передел границ, образование социалистического блока, раскол Германии на ФРГ и ГДР.<br>• **III этап (1960–1980-е):** распад мировой колониальной системы, появление десятков независимых государств в Африке и Азии.<br>• **IV этап (с 1990-х по н. в.):** распад СССР (15 суверенных государств), распад Югославии и Чехословакии, объединение Германии. | • Российская Федерация<br>• Страны СНГ<br>• Государства Европейского союза<br>• Страны Азиатско-Тихоокеанского региона<br>• Страны Африки и Латинской Америки |\n\n---\n\n### 5. Домашнее задание (под диктовку учителя)\n* <u>В тетради:</u> завершить таблицу этапов формирования политической карты мира (заполнить строки Нового и Новейшего периодов с ключевыми процессами и государствами).\n* <u>Повторить:</u> определения экономической географии, политической карты мира, факторы распада древних империй; иметь при себе географический атлас.",

          "notes_md": "# География Конспект в тетрадь\n**Дата:** 25 сентября 2026 г. (Пятница)\n**Преподаватель:** Бахтина С.А. **Кабинет:** 302 **Время:** 10:10 – 13:40 (2 пары)\n\n---\n\n### ТЕМА УРОКА\n> <u>**Формирование политической карты мира. Роль исторических лидеров в трансформации границ и периодизация развития политической карты.**</u>\n\n---\n\n### 1. Исторические личности и трансформация политической карты\n\nПолитическая карта мира складывалась веками в результате военных завоеваний, межгосударственных союзов, распада империй и экономических преобразований. Деятельность выдающихся правителей закладывала экономическую и территориальную основу современных государств.\n\n* <u>**Александр Македонский (IV в. до н. э.):**</u>\n  * Создание грандиозной державы, простиравшейся от Балканского полуострова и Египта до Средней Азии (территории современных Таджикистана и Узбекистана) и границ Индии.\n  * *Причины быстрого распада империи:* после смерти Александра империя распалась из-за внутренних распрей между военачальниками (диадохами), культурной и религиозной неоднородности покорённых народов и отсутствия устойчивых внутренних экономических связей.\n* <u>**Гай Юлий Цезарь и Клеопатра (I в. до н. э.):**</u>\n  * Геополитическая борьба за контроль над Средиземным морем между Римской республикой и эллинистическим Египтом.\n  * Взаимодействие двух держав носило не только военный, но и торгово-экономический характер: обеспечение продовольственной безопасности Рима (египетское зерно) и контроль морских торговых путей.\n* <u>**Карл Великий (VIII–IX вв.):**</u>\n  * Создатель Франкской империи, объединившей большую часть Западной и Центральной Европы; прообраз европейской интеграции.\n  * Проведение денежной реформы (введение единой серебряной монеты), унификация законов, опора на католическую церковь для централизации управления.\n* <u>**Чингисхан и Монгольская империя (XIII в.):**</u>\n  * Создание крупнейшей в мировой истории континентальной империи.\n  * Полный контроль над трансевразийскими торговыми путями (Великий шёлковый путь).\n  * На Руси — установление монголо-татарского ига (Золотая Орда), система баскачества, выплата дани и институт заложников для удержания политического повиновения князей.\n* <u>**Пётр I (XVII–XVIII вв.):**</u>\n  * Коренное изменение геополитического статуса России: завоевание выхода к Балтийскому морю («прорубил окно в Европу»), превращение Московского царства в Российскую империю (1721 г.).\n  * Создание мощного регулярного флота, развитие металлургии, горного дела и мануфактурной торговли.\n\n---\n\n### 2. Зарождение экономической географии и роль карт\n\n* <u>**Политическая карта мира**</u> — это тематическая географическая карта, отображающая территориально-политическое деление мира: суверенные государства, зависимые территории, их границы, столицы и форму правления.\n* <u>**Коммерческая (экономическая) география:**</u>\n  * Зародилась в среде итальянских (Венеция, Генуя) и голландских купцов и мореплавателей.\n  * Для организации торговых караванов и морских экспедиций требовались карты с фиксацией не только береговых линий, но и морских течений, безопасных фарватеров, характеристик гаваней, источников дефицитного сырья и рынков сбыта товаров.\n* <u>**Эпоха Великих географических открытий (XV–XVI вв.):**</u>\n  * Картография стала стратегической государственной тайной. Обладание точной картой морского маршрута давало абсолютное преимущество в торговле и колонизации.\n\n---\n\n### 3. Взаимосвязь экономики и политики\n\n* Карта называется **политической**, но её первопричина — **экономика**.\n* *«Без экономики нет политики, а политика всегда опирается на экономику»* — передел границ, аннексии, колонизация и объединение территорий всегда диктуются борьбой за природные ресурсы, морские проливы, торговые пути и плодородные земли.\n\n---\n\n### 4. Этапы формирования политической карты мира (запись в 3 колонки)\n\n| Период и формация | Сущность этапа и ключевые события | Примеры государств эпохи |     let currentWeekIndex = 3; // Default to Week 4
    let currentDate = '2026-09-21';
    let currentMode = 'schedule';
    let selectedSubject = 'Все предметы';

    function init() {
      // Date Picker listener
      const dateInput = document.getElementById('dateInput');
      dateInput.addEventListener('change', (e) => {
        selectDate(e.target.value);
      });

      // Keyboard Esc for modal
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });

      // Scroll listener for outline highlighting
      window.addEventListener('scroll', updateActiveOutlineItem, { passive: true });

      updateWeekUI();
      renderTabs();
      renderDay(currentDate);
      initSubjectFilterBar();
      renderSubjectsView();
    }

    // ==========================================
    // View Mode Switching
    // ==========================================
    function switchViewMode(mode) {
      currentMode = mode;
      const btnSchedule = document.getElementById('btnModeSchedule');
      const btnSubjects = document.getElementById('btnModeSubjects');
      const viewSchedule = document.getElementById('viewSchedule');
      const viewSubjects = document.getElementById('viewSubjects');

      if (mode === 'schedule') {
        btnSchedule.classList.add('active');
        btnSubjects.classList.remove('active');
        viewSchedule.style.display = 'block';
        viewSubjects.classList.remove('active');
      } else {
        btnSchedule.classList.remove('active');
        btnSubjects.classList.add('active');
        viewSchedule.style.display = 'none';
        viewSubjects.classList.add('active');
        renderSubjectsView();
      }
    }

    // ==========================================
    // Daily Schedule View
    // ==========================================
    function changeWeek(delta) {
      const newIndex = currentWeekIndex + delta;
      if (newIndex < 0 || newIndex >= APP.weeks.length) return;
      currentWeekIndex = newIndex;
      
      const targetWeek = APP.weeks[currentWeekIndex];
      if (!targetWeek.dates.includes(currentDate)) {
        currentDate = targetWeek.dates[0];
        document.getElementById('dateInput').value = currentDate;
      }

      updateWeekUI();
      renderTabs();
      renderDay(currentDate);
    }

    function updateWeekUI() {
      const week = APP.weeks[currentWeekIndex];
      document.getElementById('weekName').textContent = week.title;
      document.getElementById('weekDates').textContent = week.range;
      
      document.getElementById('prevWeekBtn').disabled = (currentWeekIndex === 0);
      document.getElementById('nextWeekBtn').disabled = (currentWeekIndex === APP.weeks.length - 1);
    }

    function renderTabs() {
      const container = document.getElementById('dateTabs');
      const targetWeek = APP.weeks[currentWeekIndex];
      const weekDays = APP.days.filter(d => targetWeek.dates.includes(d.date));

      container.innerHTML = weekDays.map(d => {
        const hasNotesAny = d.lessons.some(l => l.has_notes);
        return `
          <button class="date-tab ${d.date === currentDate ? 'active' : ''}" onclick="selectDate('${d.date}')">
            <span>${d.weekday}, ${d.short_day}</span>
            ${hasNotesAny ? '<span class="tab-badge" title="Есть конспект"></span>' : ''}
          </button>
        `;
      }).join('');
    }

    function selectDate(date) {
      currentDate = date;
      document.getElementById('dateInput').value = date;

      const weekIdx = APP.weeks.findIndex(w => w.dates.includes(date));
      if (weekIdx !== -1 && weekIdx !== currentWeekIndex) {
        currentWeekIndex = weekIdx;
        updateWeekUI();
      }

      renderTabs();
      renderDay(date);
    }

    function renderDay(date) {
      const dayData = APP.days.find(d => d.date === date);
      const titleEl = document.getElementById('dayTitle');
      const listEl = document.getElementById('lessonsList');

      if (!dayData) {
        titleEl.textContent = `${date} (Нет данных)`;
        listEl.innerHTML = `
          <div style="background:white; border-radius:14px; padding:36px; text-align:center; color:#64748b; border:1px dashed #cbd5e1;">
            В этот день занятий нет в расписании.
          </div>
        `;
        return;
      }

      titleEl.textContent = dayData.date_display;

      listEl.innerHTML = dayData.lessons.map(l => {
        const isEmpty = l.subject === '—';
        return `
          <div class="lesson-card ${isEmpty ? 'is-empty' : ''} ${l.has_notes ? 'has-notes' : ''}">
            <div class="lesson-left">
              <div class="lesson-num">${l.num}</div>
              <div class="lesson-info">
                <span class="lesson-time">${l.time}</span>
                <span class="lesson-subject">${l.subject}</span>
                ${(l.room || l.teacher) ? `
                  <div class="lesson-meta">
                    ${l.room ? `<span>${l.room}</span>` : ''}
                    ${l.teacher ? `<span>${l.teacher}</span>` : ''}
                  </div>
                ` : ''}
                ${l.topic ? `<div class="lesson-topic">${l.topic}</div>` : ''}
              </div>
            </div>
            ${l.has_notes ? `
              <div class="lesson-actions">
                <button class="btn-notes" onclick="openNotes('${dayData.date}', ${l.num})">
                  Открыть конспект
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // ==========================================
    // By Subject View with Google Docs Outline
    // ==========================================
    const SUBJECT_CATEGORIES = [
      'Все предметы',
      'Математика',
      'Физика',
      'Биология',
      'География',
      'Литература',
      'Родная литература',
      'Русский язык'
    ];

    function initSubjectFilterBar() {
      const container = document.getElementById('subjectFilterBar');
      container.innerHTML = SUBJECT_CATEGORIES.map(cat => `
        <button class="subject-pill ${cat === selectedSubject ? 'active' : ''}" onclick="selectSubjectFilter('${cat}')">
          ${cat}
        </button>
      `).join('');
    }

    function selectSubjectFilter(cat) {
      selectedSubject = cat;
      initSubjectFilterBar();
      renderSubjectsView();
    }

    function normalizeSubject(name) {
      if (!name) return '';
      if (name.includes('Математика') || name.includes('Алгебра')) return 'Математика';
      if (name.includes('Физика')) return 'Физика';
      if (name.includes('Биология')) return 'Биология';
      if (name.includes('Родная литература')) return 'Родная литература';
      if (name.includes('Литература')) return 'Литература';
      if (name.includes('География')) return 'География';
      if (name.includes('Русский')) return 'Русский язык';
      return name;
    }

    function getAllNotesList() {
      const notesList = [];
      const seenFiles = new Set();

      APP.days.forEach(d => {
        d.lessons.forEach(l => {
          if (l.has_notes && l.notes_md && l.notes_file && !seenFiles.has(l.notes_file)) {
            seenFiles.add(l.notes_file);
            notesList.push({
              date: d.date,
              date_display: d.date_display,
              lesson: l,
              category: normalizeSubject(l.subject)
            });
          }
        });
      });

      // Chronological sort
      notesList.sort((a, b) => a.date.localeCompare(b.date));
      return notesList;
    }

    function renderSubjectsView() {
      const allNotes = getAllNotesList();
      const filtered = (selectedSubject === 'Все предметы')
        ? allNotes
        : allNotes.filter(n => n.category === selectedSubject);

      const contentEl = document.getElementById('subjectsContent');
      const outlineEl = document.getElementById('outlineNav');

      if (filtered.length === 0) {
        contentEl.innerHTML = `
          <div style="background:white; border-radius:16px; padding:48px; text-align:center; color:#64748b; border:1px dashed #cbd5e1;">
            По выбранному предмету конспектов пока нет.
          </div>
        `;
        outlineEl.innerHTML = `<li class="outline-item" style="color:#94a3b8; padding:8px;">Нет записей</li>`;
        return;
      }

      let contentHtml = '';
      let outlineHtml = '';
      let lastDate = '';

      filtered.forEach((item, index) => {
        const cardId = `note-card-${item.date}-${index}`;

        // Date Divider Ribbon
        if (item.date !== lastDate) {
          lastDate = item.date;
          const dateAnchor = `date-divider-${item.date}`;
          contentHtml += `
            <div class="date-divider" id="${dateAnchor}">
              <div class="date-divider-line"></div>
              <div class="date-divider-badge">${item.date_display}</div>
              <div class="date-divider-line"></div>
            </div>
          `;

          outlineHtml += `
            <li class="outline-item">
              <a class="outline-link level-date" href="#${dateAnchor}" onclick="scrollToElement('${dateAnchor}', event)">
                ${item.date_display.split('(')[0].trim()}
              </a>
            </li>
          `;
        }

        // Render card
        contentHtml += `
          <article class="subject-note-card" id="${cardId}">
            <div class="subject-note-header">
              <div class="subject-note-header-left">
                <h3>${item.lesson.subject}</h3>
                <div class="subject-note-meta">
                  ${item.date_display} • ${item.lesson.time} ${item.lesson.room ? '• ' + item.lesson.room : ''} ${item.lesson.teacher ? '• ' + item.lesson.teacher : ''}
                </div>
              </div>
            </div>
            <div class="subject-note-body">
              <div class="notes-rendered">${renderMarkdown(item.lesson.notes_md, cardId)}</div>
            </div>
          </article>
        `;

        // Outline: Only main topic link (no subtopics)
        const topicLabel = item.lesson.topic || item.lesson.subject;
        const subjectPrefix = (selectedSubject === 'Все предметы') ? `<strong>${item.category}:</strong> ` : '';
        outlineHtml += `
          <li class="outline-item">
            <a class="outline-link level-topic" href="#${cardId}" onclick="scrollToElement('${cardId}', event)">
              ${subjectPrefix}${topicLabel}
            </a>
          </li>
        `;
      });

      contentEl.innerHTML = contentHtml;
      outlineEl.innerHTML = outlineHtml;
    }

    function scrollToElement(id, e) {
      if (e) e.preventDefault();
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function updateActiveOutlineItem() {
      if (currentMode !== 'subjects') return;
      const links = document.querySelectorAll('.docs-outline .outline-link');
      if (!links.length) return;

      const fromTop = window.scrollY + 120;
      let currentActive = null;

      links.forEach(link => {
        const targetId = link.getAttribute('href').replace('#', '');
        const target = document.getElementById(targetId);
        if (target && target.offsetTop <= fromTop) {
          currentActive = link;
        }
      });

      links.forEach(l => l.classList.remove('active'));
      if (currentActive) {
        currentActive.classList.add('active');
      }
    }

    // ==========================================
    // Markdown & KaTeX Engine with Heading Anchors
    // ==========================================
    function renderMarkdown(md, baseId = '') {
      if (!md) return '';

      const mathTokens = [];

      // Display math $$...$$
      let text = md.replace(/\$\$([\s\S]*?)\$\$/g, (match, expr) => {
        let rendered = '';
        if (window.katex && typeof katex.renderToString === 'function') {
          try {
            rendered = katex.renderToString(expr.trim(), { displayMode: true, throwOnError: false });
          } catch (e) {
            rendered = '<pre class="math-fallback">' + expr.trim() + '</pre>';
          }
        } else {
          rendered = '<div class="math-fallback">' + expr.trim() + '</div>';
        }
        const token = '@@MATH_BLOCK_' + mathTokens.length + '@@';
        mathTokens.push({ token, html: '<div class="math-display-container">' + rendered + '</div>' });
        return '\n\n' + token + '\n\n';
      });

      // Inline math $...$
      text = text.replace(/\$([^\$\n]+?)\$/g, (match, expr) => {
        let rendered = '';
        if (window.katex && typeof katex.renderToString === 'function') {
          try {
            rendered = katex.renderToString(expr.trim(), { displayMode: false, throwOnError: false });
          } catch (e) {
            rendered = '<code>' + expr.trim() + '</code>';
          }
        } else {
          rendered = '<code>' + expr.trim() + '</code>';
        }
        const token = '@@MATH_INLINE_' + mathTokens.length + '@@';
        mathTokens.push({ token, html: rendered });
        return token;
      });

      // Parse with fallback/custom renderer with IDs for headings
      let html = parseMarkdownWithAnchors(text, baseId);

      // Restore math tokens
      for (const item of mathTokens) {
        html = html.split('<p>' + item.token + '</p>').join(item.html);
        html = html.split(item.token).join(item.html);
      }

      return html;
    }

    function parseMarkdownWithAnchors(md, baseId) {
      let lines = md.split('\n');
      let html = '';
      let inList = false;
      let inOrderedList = false;
      let headingIndex = 0;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        if (line.trim() === '---') {
          if (inList) { html += '</ul>'; inList = false; }
          if (inOrderedList) { html += '</ol>'; inOrderedList = false; }
          html += '<hr>';
          continue;
        }

        if (line.startsWith('# ')) {
          if (inList) { html += '</ul>'; inList = false; }
          if (inOrderedList) { html += '</ol>'; inOrderedList = false; }
          html += '<h1>' + formatInline(line.substring(2)) + '</h1>';
          continue;
        }
        if (line.startsWith('## ')) {
          if (inList) { html += '</ul>'; inList = false; }
          if (inOrderedList) { html += '</ol>'; inOrderedList = false; }
          const title = line.substring(3);
          let idAttr = '';
          if (baseId && !title.includes('ТЕМА УРОКА')) {
            headingIndex++;
            idAttr = ` id="${baseId}-h${headingIndex}" style="scroll-margin-top: 24px;"`;
          }
          html += `<h2${idAttr}>` + formatInline(title) + '</h2>';
          continue;
        }
        if (line.startsWith('### ')) {
          if (inList) { html += '</ul>'; inList = false; }
          if (inOrderedList) { html += '</ol>'; inOrderedList = false; }
          const title = line.substring(4);
          let idAttr = '';
          if (baseId && !title.includes('ТЕМА УРОКА')) {
            headingIndex++;
            idAttr = ` id="${baseId}-h${headingIndex}" style="scroll-margin-top: 24px;"`;
          }
          html += `<h3${idAttr}>` + formatInline(title) + '</h3>';
          continue;
        }
        if (line.startsWith('#### ')) {
          if (inList) { html += '</ul>'; inList = false; }
          if (inOrderedList) { html += '</ol>'; inOrderedList = false; }
          const title = line.substring(5);
          let idAttr = '';
          if (baseId && !title.includes('ТЕМА УРОКА')) {
            headingIndex++;
            idAttr = ` id="${baseId}-h${headingIndex}" style="scroll-margin-top: 24px;"`;
          }
          html += `<h4${idAttr}>` + formatInline(title) + '</h4>';
          continue;
        }

        if (line.startsWith('> ')) {
          if (inList) { html += '</ul>'; inList = false; }
          if (inOrderedList) { html += '</ol>'; inOrderedList = false; }
          html += '<blockquote>' + formatInline(line.substring(2)) + '</blockquote>';
          continue;
        }

        // Markdown Table Parser
        if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
          if (inList) { html += '</ul>'; inList = false; }
          if (inOrderedList) { html += '</ol>'; inOrderedList = false; }

          let tableLines = [];
          while (i < lines.length && lines[i].trim().startsWith('|') && lines[i].trim().endsWith('|')) {
            tableLines.push(lines[i].trim());
            i++;
          }
          i--;

          if (tableLines.length >= 2) {
            let headerLine = tableLines[0];
            let sepLine = tableLines[1];
            let isSep = /^\|(\s*:?-+:?\s*\|)+$/.test(sepLine);
            if (isSep) {
              const parseRowCells = (row) => {
                let raw = row.substring(1, row.length - 1);
                return raw.split('|').map(c => c.trim());
              };

              let alignments = parseRowCells(sepLine).map(col => {
                let left = col.startsWith(':');
                let right = col.endsWith(':');
                if (left && right) return 'center';
                if (right) return 'right';
                return 'left';
              });

              let headers = parseRowCells(headerLine);
              let tableHtml = '<div class="table-container"><table class="notes-table">';
              tableHtml += '<thead><tr>';
              headers.forEach((h, idx) => {
                let align = alignments[idx] || 'left';
                tableHtml += `<th style="text-align: ${align};">` + formatInline(h) + '</th>';
              });
              tableHtml += '</tr></thead><tbody>';

              for (let r = 2; r < tableLines.length; r++) {
                let rowCells = parseRowCells(tableLines[r]);
                tableHtml += '<tr>';
                for (let c = 0; c < headers.length; c++) {
                  let cellContent = rowCells[c] !== undefined ? rowCells[c] : '';
                  let align = alignments[c] || 'left';
                  tableHtml += `<td style="text-align: ${align};">` + formatInline(cellContent) + '</td>';
                }
                tableHtml += '</tr>';
              }
              tableHtml += '</tbody></table></div>';
              html += tableHtml;
              continue;
            }
          }
          for (let tl of tableLines) {
            html += '<p>' + formatInline(tl) + '</p>';
          }
          continue;
        }

        if (line.trim().startsWith('* ') || line.trim().startsWith('- ')) {
          if (inOrderedList) { html += '</ol>'; inOrderedList = false; }
          if (!inList) { html += '<ul>'; inList = true; }
          html += '<li>' + formatInline(line.trim().substring(2)) + '</li>';
          continue;
        } else if (inList) {
          html += '</ul>';
          inList = false;
        }

        if (/^\d+\.\s/.test(line.trim())) {
          if (inList) { html += '</ul>'; inList = false; }
          if (!inOrderedList) { html += '<ol>'; inOrderedList = true; }
          let itemText = line.trim().replace(/^\d+\.\s+/, '');
          html += '<li>' + formatInline(itemText) + '</li>';
          continue;
        } else if (inOrderedList) {
          html += '</ol>';
          inOrderedList = false;
        }

        if (line.trim().length > 0) {
          html += '<p>' + formatInline(line) + '</p>';
        }
      }
      if (inList) html += '</ul>';
      if (inOrderedList) html += '</ol>';
      return html;
    }

    function formatInline(str) {
      return str
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code style="background:#e2e8f0; padding:2px 6px; border-radius:4px; font-size:0.9em;">$1</code>');
    }

    // ==========================================
    // Fullscreen Modal
    // ==========================================
    function openNotes(date, num) {
      const day = APP.days.find(d => d.date === date);
      if (!day) return;
      const lesson = day.lessons.find(l => l.num === num);
      if (!lesson || !lesson.has_notes) return;

      document.getElementById('modalSubject').textContent = lesson.subject;
      document.getElementById('modalMeta').textContent = `${day.date_display} • ${lesson.time} ${lesson.room ? '• ' + lesson.room : ''} ${lesson.teacher ? '• ' + lesson.teacher : ''}`;
      document.getElementById('modalNotesRendered').innerHTML = renderMarkdown(lesson.notes_md);

      document.getElementById('modalBackdrop').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('active');
      document.body.style.overflow = '';
    }

    window.onload = init;
  </script>
</body>
